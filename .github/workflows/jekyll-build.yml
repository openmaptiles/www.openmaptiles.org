name: Jekyll build check

# Build check for pull requests and manual runs. Pushes to master are built and
# published by deploy.yml, so this deliberately does not run there.
#
# Runs the same `script/verify-build` the deploy job runs, so a PR fails for the same
# reasons production would refuse to publish — including a missing legacy redirect.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Ruby version comes from .ruby-version (3.3.6) via setup-ruby's default. See
      # deploy.yml for why there is no `ruby-version-file` input here.
      # bundler-cache honours Gemfile.lock.
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Build (production config)
        run: bundle exec jekyll build --trace
        env:
          JEKYLL_ENV: production

      - name: Verify build output
        run: script/verify-build

      - name: Upload site
        uses: actions/upload-artifact@v7
        with:
          name: jekyll-site
          path: _site
          retention-days: 7
